<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hue Travel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #f2f2f2;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }
        section {
            padding: 20px;
        }
        .attractions {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-around;
        }
        .attraction {
            flex-basis: 30%;
            text-align: center;
            border: 1px solid #ddd;
            padding: 10px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
        }
        .attraction img {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>Hue Travel</h1>
    </header>
    <section>
        <h2>Giới thiệu về Huế</h2>
        <p>Giới thiệu ngắn gọn về Huế. Trang web có bố cục đơn giản và cơ bản.</p>
    </section>
    <section>
        <h2>Các địa điểm du lịch nổi tiếng</h2>
        <div class="attractions">
            <div class="attraction">
                <h3>Điểm du lịch 1</h3>
                <img src="image1.jpg" alt="Điểm du lịch 1">
                <p>Mô tả ngắn gọn về điểm du lịch 1.</p>
            </div>
            <div class="attraction">
                <h3>Điểm du lịch 2</h3>
                <img src="image2.jpg" alt="Điểm du lịch 2">
                <p>Mô tả ngắn gọn về điểm du lịch 2.</p>
            </div>
            <div class="attraction">
                <h3>Điểm du lịch 3</h3>
                <img src="image3.jpg" alt="Điểm du lịch 3">
                <p>Mô tả ngắn gọn về điểm du lịch 3.</p>
            </div>
        </div>
    </section>
</body>
</html>
